
name: Automated US History Shorts (Every 12 Hours)

on:
  schedule:
    # Primary and backup execution slots
    - cron: '25 1,4,13,16 * * *'

  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom history topic'
        required: false
        default: ''

      max_ai_images:
        description: 'Maximum paid AI images per Short (0 = disabled)'
        required: false
        default: '0'

      dry_run:
        description: 'True = render preview only; false = upload'
        required: false
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

concurrency:
  group: us-history-shorts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-liberation fonts-dejavu-core libmagic1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate Sound Effects
        run: |
          python src/sfx_generator.py

      - name: Run History Shorts Pipeline
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'centralindia' }}
          AZURE_TTS_VOICE: ${{ secrets.AZURE_TTS_VOICE || 'en-US-BrianMultilingualNeural' }}

          BG_MUSIC_VOLUME: ${{ secrets.BG_MUSIC_VOLUME || '0.28' }}
          BGM_URL: ${{ secrets.BGM_URL || '' }}

          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_IMAGE_MODEL: ${{ secrets.FOUNDRY_IMAGE_MODEL || 'MAI-Image-2.6-Flash' }}

          MAX_AI_IMAGES_PER_SHORT: ${{ github.event.inputs.max_ai_images || secrets.MAX_AI_IMAGES_PER_SHORT || '0' }}

          FOUNDRY_TEXT_API_KEY: ${{ secrets.FOUNDRY_TEXT_API_KEY }}
          FOUNDRY_TEXT_ENDPOINT: ${{ secrets.FOUNDRY_TEXT_ENDPOINT }}
          FOUNDRY_TEXT_MODEL: ${{ secrets.FOUNDRY_TEXT_MODEL || 'gpt-6-luna' }}

          SHORTS_PER_DAY: ${{ secrets.SHORTS_PER_DAY || '2' }}
          VOICE_SPEED_PERCENT: ${{ secrets.VOICE_SPEED_PERCENT || '3' }}

          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          YOUTUBE_PRIVACY_STATUS: ${{ secrets.YOUTUBE_PRIVACY_STATUS || 'unlisted' }}

          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic || '' }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}

        run: |
          python src/main.py

      - name: Upload Rendered Short
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('output/final_short.mp4') != ''
        with:
          name: rendered-short-${{ github.run_id }}
          path: |
            output/final_short.mp4
            output/subtitles.ass
            output/metadata.json
          retention-days: 7

      - name: Commit Updated Topic Queue
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "History Shorts Auto-Bot"

          git add data/used_topics.json data/upload_history.json data/topics_seed.json

          if ! git diff --staged --quiet; then
            git commit -m "chore: record completed history short"
          fi

          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 2
          done
