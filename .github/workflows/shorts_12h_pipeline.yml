name: Automated US History Shorts (Every 12 Hours — ComfyUI + Kaggle GPU + HyperFrames v13.0)

on:
  schedule:
    # Primary slots (01:25 UTC & 13:25 UTC) + backup slots (04:25 UTC & 16:25 UTC)
    - cron: '25 1,4,13,16 * * *'
  workflow_dispatch:
    inputs:
      custom_topic:
        description: 'Optional custom history topic (leave blank to auto-pick next unused topic)'
        required: false
        default: ''
      max_ai_images:
        description: 'Maximum MAI-Image-2.6-Flash keyframes per Short (default 10)'
        required: false
        default: '10'
      max_comfy_videos:
        description: 'Maximum ComfyUI I2V video clips per Short (default 10 when GPU active)'
        required: false
        default: '10'
      use_kaggle_gpu:
        description: 'Dispatch to ephemeral Kaggle GPU if KAGGLE_USERNAME & KAGGLE_KEY are set (auto / true / false)'
        required: false
        default: 'auto'
      render_engine:
        description: 'Video rendering engine (hyperframes = HTML/GSAP/Shader + FFmpeg hybrid, ffmpeg = direct FFmpeg)'
        required: false
        default: 'hyperframes'
      dry_run:
        description: 'Skip YouTube upload (true = render preview only, false = publish to YouTube)'
        required: false
        default: 'false'

permissions:
  contents: write

concurrency:
  group: us-history-shorts-pipeline
  cancel-in-progress: false

jobs:
  generate-and-upload-short:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore reusable media cache
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: history-media-${{ runner.os }}-${{ hashFiles('data/topics_seed.json') }}
          restore-keys: |
            history-media-${{ runner.os }}-

      - name: Set up System Dependencies (FFmpeg, Fonts & Chromium Headless Deps)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-montserrat fonts-liberation fonts-dejavu-core libmagic1 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libxkbcommon0 libxcomposite1 libxdamage1 libxrandr2 libgbm1 libasound2t64 || sudo apt-get install -y ffmpeg fonts-montserrat fonts-liberation fonts-dejavu-core libmagic1

      - name: Set up Node.js 22 for HyperFrames Engine
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install HyperFrames CLI Engine
        run: |
          npm install --no-audit --no-fund || npm install -g hyperframes || true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt kaggle six playwright
          python -m playwright install chromium

      - name: Run Automated Unit Tests
        run: |
          python -m unittest discover -s tests -v

      - name: Synthesize Documentary Score & Hook Impact SFX
        run: |
          python src/sfx_generator.py

      - name: Run End-to-End History Short Pipeline (ComfyUI + Kaggle GPU + HyperFrames v13.0)
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          AZURE_SPEECH_REGION: ${{ secrets.AZURE_SPEECH_REGION || 'centralindia' }}
          AZURE_TTS_VOICE: ${{ secrets.AZURE_TTS_VOICE || 'en-US-BrianMultilingualNeural' }}
          BG_MUSIC_VOLUME: ${{ secrets.BG_MUSIC_VOLUME || '0.18' }}
          BGM_URL: ${{ secrets.BGM_URL || '' }}
          FOUNDRY_API_KEY: ${{ secrets.FOUNDRY_API_KEY }}
          FOUNDRY_ENDPOINT: ${{ secrets.FOUNDRY_ENDPOINT }}
          FOUNDRY_IMAGE_MODEL: ${{ secrets.FOUNDRY_IMAGE_MODEL || 'MAI-Image-2.6-Flash' }}
          MAX_AI_IMAGES_PER_SHORT: ${{ github.event.inputs.max_ai_images || '10' }}
          MAX_COMFY_VIDEOS_PER_SHORT: ${{ github.event.inputs.max_comfy_videos || '10' }}
          COMFYUI_API_URL: ${{ secrets.COMFYUI_API_URL || vars.COMFYUI_API_URL || '' }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_KEY }}
          USE_KAGGLE_GPU: ${{ github.event.inputs.use_kaggle_gpu || 'auto' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          RENDER_ENGINE: ${{ github.event.inputs.render_engine || vars.RENDER_ENGINE || 'hyperframes' }}
          FOUNDRY_TEXT_API_KEY: ${{ secrets.FOUNDRY_TEXT_API_KEY }}
          FOUNDRY_TEXT_ENDPOINT: ${{ secrets.FOUNDRY_TEXT_ENDPOINT }}
          FOUNDRY_TEXT_MODEL: ${{ secrets.FOUNDRY_TEXT_MODEL || 'gpt-6-luna' }}
          SHORTS_PER_DAY: ${{ secrets.SHORTS_PER_DAY || '2' }}
          VOICE_SPEED_PERCENT: ${{ secrets.VOICE_SPEED_PERCENT || '2' }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          NARA_API_KEY: ${{ secrets.NARA_API_KEY }}
          YOUTUBE_PRIVACY_STATUS: 'public'
          MEDIA_CACHE_DIR: .cache/media
          MIN_AUTHENTIC_MEDIA_RATIO: ${{ vars.MIN_AUTHENTIC_MEDIA_RATIO || '0.20' }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          CUSTOM_TOPIC: ${{ github.event.inputs.custom_topic }}
          DRY_RUN: ${{ github.event.inputs.dry_run || secrets.DRY_RUN || 'false' }}
        run: |
          python scripts/trigger_kaggle_gpu_from_github.py || python src/main.py

      - name: Upload Rendered Short & HyperFrames Composition Bundle as Workflow Artifact
        uses: actions/upload-artifact@v4
        if: always() && hashFiles('output/final_short.mp4') != ''
        with:
          name: rendered-short-${{ github.run_id }}
          path: |
            output/final_short.mp4
            output/subtitles.ass
            output/metadata.json
            output/quality_report.json
            output/hyperframes_project/index.html
            output/hyperframes_project/preview.html
            output/hyperframes_project/DESIGN.md
          retention-days: 7

      - name: Commit Updated Topic Queue & History State (Backup Sync)
        if: always() && github.event.inputs.dry_run != 'true'
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "History Shorts Auto-Bot"
          git add data/used_topics.json data/upload_history.json data/topics_seed.json
          if ! git diff --staged --quiet; then
            git commit -m "chore: record completed history short [skip ci]"
          fi
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && break
            sleep 2
          done
